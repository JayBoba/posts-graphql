services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: posts
      POSTGRES_PASSWORD: posts   # LOCAL ONLY
      POSTGRES_DB: posts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts -d posts"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://posts:posts@postgres:5432/posts?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: